backend: omni_moshi
env: omni_moshi
python: "3.12"
torch:
  - torch==2.9.1
  - torchaudio==2.9.1
lock: omni_moshi
lock_flags: [--no-deps]        # the lock is a complete uv pip freeze: nothing to resolve
