backend: music_heartmula
env: music_heartmula
python: "3.12"
torch:
  - torch==2.9.1
  - torchaudio==2.9.1
lock: music_heartmula
lock_flags: [--no-deps]        # the lock is a complete uv pip freeze: nothing to resolve
vendor: [heartlib]
steps: []
check: "import torch, heartlib, torchao"
manual:
  - "The studio builds vendor/heartmula_ckpt (a symlink farm into the HF cache) itself on first run: download the three HeartMuLa repos first (./install.sh model heartmula-3b)."
tested: []
size_gb: 5
shares_env_with: null
