backend: clonea_xtts
env: clonea_xtts
python: "3.12"
torch:
  - torch==2.9.1
  - torchaudio==2.9.1
  - torchcodec==0.17.0
lock: clonea_xtts
lock_flags: [--no-deps]        # the lock is a complete uv pip freeze: nothing to resolve
