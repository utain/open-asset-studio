backend: foley
env: foley
python: "3.12"
torch:
  - torch==2.9.1
  - torchaudio==2.9.1
  - torchvision==0.24.1
lock: foley
lock_flags: [--no-deps]        # the lock is a complete uv pip freeze: nothing to resolve
vendor: [MMAudio, HunyuanVideo-Foley, ThinkSound]
steps:
  - uv pip install --no-deps -e ./vendor/MMAudio
check: "import torch, mmaudio, open_clip, av, timm, audiotools"
manual:
  - "Foley weights are large (ThinkSound 25 GB, HunyuanVideo-Foley 15 GB). Check each sha256 after a download: from_pretrained does not notice holes in a blob."
tested: [linux-aarch64]
size_gb: 6
shares_env_with: null
