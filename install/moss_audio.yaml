backend: moss_audio
env: moss_audio
python: "3.12"
torch:
  - torch==2.9.1
  - torchaudio==2.9.1
lock: moss_audio
lock_flags: []
vendor: [MOSS-Audio]
# MOSS-Audio is not pip-installable (its package is the generic name `src`): workers/moss_audio_worker.py puts vendor/MOSS-Audio on sys.path.
steps: []
check: "import torch, transformers, soundfile, soxr, tiktoken; assert transformers.__version__ == '4.57.1'"
manual: []
tested: [linux-aarch64]
size_gb: 5
shares_env_with: null
