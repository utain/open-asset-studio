# Cloud (API) models. Schema: docs/CONTRACTS.md section 8. Backend kind `cloud`: no venv / weights; status is
# cloud_disabled (global switch off) | missing_key | ready, computed by app/plugins/providers.py.
# `provider` = fal | replicate | openrouter | openai | gemini | elevenlabs | meshy | tripo | openai_compat:<name>
# `remote_model` / `remote: {task: id}` = the provider's model / endpoint id. `request` = how params map to the
# provider's input (app/cloud/common.py). `pricing` (USD) drives the estimate on the Generate button and the
# budget / confirm checks; prices change: `pricing_checked` + `pricing_source` say where a number came from, the
# Providers page can override any of them. `unverified: true` = endpoint id or shape not confirmed on an official page.
# Checked 2026-11-05 (web research; no real keys were used).

tasks:
  text3d: {label: Text to 3D, modality: mesh, studio: 3d}
  write:  {label: Writing assistant, modality: text, studio: assistant}

backends:
  cloud:
    label: Cloud APIs (in-process HTTP, no GPU)
    kind: cloud
    device: cpu
    handler: cloud

x-params:
  aspect: &aspect {name: aspect, type: choice, choices: ["1:1", "4:3", "3:4", "3:2", "2:3", "16:9", "9:16"], default: "1:1", group: basic, tasks: [t2i, rgba]}
  batch4: &batch4 {name: batch, label: Images, type: int, min: 1, max: 4, default: 1, group: basic}
  seed: &seed {name: seed, type: seed, default: -1}
  takes: &takes {name: batch, label: Takes, type: int, min: 1, max: 4, default: 1, group: basic}
  line: &line {name: text, label: Line, type: textarea, default: "", group: basic}

