    modality: audio
    tasks: [sfx, ambience, music]
    order: 130
    tags: [stereo, 44k, blocked]
    summary: "Stability's open 47 s stereo text-to-audio model (DiT). Gated: accept the licence on Hugging Face and log in. The studio already has Stable Audio 3."
    features: {max_seconds: 47, sample_rate: 44100, channels: 2, negative: true, languages: [en], blocked: "gated on Hugging Face (401 without a login); accept the licence, hf auth login, then add a loader for diffusers StableAudioPipeline"}
    backend: sfxmore
    weights: [{hf: stabilityai/stable-audio-open-1.0, files: ["transformer/*.safetensors", "vae/*.safetensors", "text_encoder/*.safetensors"], fix: "Gated repo: accept the licence at huggingface.co/stabilityai/stable-audio-open-1.0, run hf auth login, then hf download stabilityai/stable-audio-open-1.0"}]
    license: {name: Stability AI Community, commercial: true, note: "Free under USD 1 M revenue; training data includes CC-BY content that needs attribution."}
    memory_gb: 10
    speed: "-"
    prompt_style: {sfx: sfx, ambience: ambience, music: sa3_music}
