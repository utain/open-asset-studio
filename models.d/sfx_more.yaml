  - id: stable-audio-open-small
    name: Stable Audio Open Small
    modality: audio
    tasks: [sfx, ambience]
    order: 131
    tags: [fast, stereo, 44k, blocked]
    summary: "Stability's 341 M open SFX model, 11 s stereo, built for fast on-device use. Gated: accept the licence on Hugging Face and log in. The studio already has Stable Audio 3 Small."
    features: {max_seconds: 11, sample_rate: 44100, channels: 2, negative: false, languages: [en], blocked: "gated on Hugging Face (401 without a login); needs stable-audio-tools format loading (model.safetensors + model_config.json)"}
    backend: sfxmore
    weights: [{hf: stabilityai/stable-audio-open-small, files: ["model.safetensors"], fix: "Gated repo: accept the licence at huggingface.co/stabilityai/stable-audio-open-small, run hf auth login, then hf download stabilityai/stable-audio-open-small"}]
    license: {name: Stability AI Community, commercial: true, note: "Free under USD 1 M revenue."}
    memory_gb: 4
    speed: "-"
    prompt_style: sfx
    params:
      - {name: seconds, label: Duration, type: float, min: 1, max: 11, step: 0.5, default: 5, unit: s, group: basic}
      - {name: batch, label: Takes, type: int, min: 1, max: 8, default: 4, group: basic}
      - {name: seed, type: seed, default: -1}
      - {name: steps, type: int, min: 4, max: 16, default: 8, group: advanced}
    presets: {}
