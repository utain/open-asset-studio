    est: {load_s: 120, run_s: 60}
    params:
      - {name: instruction, label: Instruction, type: textarea, default: "", group: basic, help: "Optional system prompt / persona, e.g. 'You are a gruff dwarven blacksmith. Answer in two sentences.'"}
      - {name: text, label: Typed message, type: textarea, default: "", group: basic, help: "Optional: a typed question instead of (or besides) the clip."}
      - {name: seconds, label: Max reply, type: float, min: 3, max: 60, step: 1, default: 20, unit: s, group: basic, help: "Upper bound for the spoken answer."}
      - {name: batch, label: Takes, type: int, min: 1, max: 3, default: 1, group: basic}
