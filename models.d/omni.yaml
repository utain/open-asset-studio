      - {name: seconds, label: Max reply, type: float, min: 3, max: 60, step: 1, default: 20, unit: s, group: basic, help: "Upper bound for the spoken answer."}
      - {name: batch, label: Takes, type: int, min: 1, max: 3, default: 1, group: basic}
      - {name: seed, type: seed, default: -1}
      - {name: temperature, type: float, min: 0.1, max: 1.5, step: 0.05, default: 0.7, group: advanced}
