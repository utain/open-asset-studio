    modality: audio
    tasks: [s2s]
    order: 87
    tags: [s2s, zh, en]
    summary: "7B audio foundation model (Qwen2.5-7B + Whisper features) with a flow-matching + BigVGAN detokenizer; spoken replies in one fixed voice. Slow: the detokenizer checkpoint is 19 GB."
    features: {languages: [zh, en], sample_rate: 24000}
    backend: omni_kimi
    input_slots:
      - {role: "audio", label: "Question clip", types: ["voice", "audio"], required: true, hint: "The spoken clip to answer (English or Chinese).", tasks: ["s2s"]}
    weights: [{hf: moonshotai/Kimi-Audio-7B-Instruct}, {hf: zai-org/glm-4-voice-tokenizer}]
    license: {name: MIT (Qwen2.5 parts Apache-2.0), commercial: true}
