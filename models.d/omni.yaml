      - {name: temperature, type: float, min: 0.1, max: 1.5, step: 0.05, default: 0.2, group: advanced}
      - {name: top_p, type: float, min: 0.1, max: 1.0, step: 0.05, default: 0.8, group: advanced}
    presets: {}

  - id: minicpm-o-4_5
    name: MiniCPM-o 4.5
    modality: audio
    tasks: [s2s, tts, voice_clone]
    order: 85
    tags: [s2s, clone, zh, en]
    summary: "9B (Qwen3-8B + Whisper + CosyVoice2-style TTS) half-duplex speech assistant. Replies in the voice of a reference clip (bundled by default); also reads text aloud in a cloned voice (en/zh)."
    features: {languages: [en, zh], instruct: true, sample_rate: 24000, needs_ref: clone}
    backend: omni_minicpm
    input_slots:
      - {role: "audio", label: "Question clip", types: ["voice", "audio"], required: false, hint: "A spoken question. Or type a message below, or both.", tasks: ["s2s"]}
      - {role: "voice_ref", label: "Voice to answer in", types: ["voice", "audio"], required: false, hint: "Optional: the reply is spoken in this voice (3-20 s of clean speech). Empty = the model's default voice.", tasks: ["s2s"]}
