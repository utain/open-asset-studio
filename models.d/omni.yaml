    tasks: [s2s]
    order: 84
    tags: [s2s, zh, en]
    summary: "End-to-end Chinese/English spoken chat (9B LM + 12.5 Hz speech tokenizer + flow decoder, 22.05 kHz). Emotion and speed follow the instruction."
    features: {languages: [zh, en], instruct: true, sample_rate: 22050}
    backend: omni_glm
    input_slots:
      - {role: "audio", label: "Question clip", types: ["voice", "audio"], required: false, hint: "A spoken question (Chinese or English). Or type a message below.", tasks: ["s2s"]}
    weights:
      - {hf: zai-org/glm-4-voice-9b}
