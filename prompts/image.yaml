# Image studio prompt-improver styles (merged after core.yaml; a style id that exists is updated key by key).
# Adds the Qwen RGBA style (trained trigger sentence) and a production chip set on every image style.
# A chip may carry `profiles: [game|video|podcast|social|film|general]` (the use-case profiles it is meant for: the web UI
# lists chips of the active profile first and dims chips tagged only for other profiles; no tag = every profile) and
# `default_for: [profile, ...]` (selected the first time a prompt box is used under that profile).

chipsets:
  image_game: &chips
    - {id: 3d_ready, label: 3D-ready, hint: "single centered subject, whole object visible, three-quarter front view, plain light background, soft even lighting, no cast shadow (will be converted to 3D)", profiles: [game]}
    - {id: transparent, label: Transparent, hint: "isolated subject on a transparent background (RGBA asset)", profiles: [game, social]}
    - {id: stylized, label: Stylized, hint: "stylized game art, hand-painted look", profiles: [game]}
    - {id: lowpoly, label: Low-poly, hint: "low-poly faceted style, flat shading, simple shapes", profiles: [game]}
    - {id: realistic, label: Realistic PBR, hint: "realistic PBR materials, physically based rendering look"}
    - {id: pixel, label: Pixel art, hint: "pixel art, limited palette, crisp pixels, no anti-aliasing", profiles: [game]}
    - {id: icon, label: UI icon, hint: "game UI icon, bold silhouette, readable at small size, centered, simple background", profiles: [game]}
    - {id: isometric, label: Isometric, hint: "isometric view, game tile/prop", profiles: [game]}
    - {id: concept, label: Concept sheet, hint: "concept art sheet, clean presentation, a few views of the same design side by side", profiles: [game, film]}
    - {id: turnaround, label: Character A-pose, hint: "full-body character, neutral A-pose, front view, arms slightly away from the body, plain background", profiles: [game, film]}
    - {id: sprite, label: 2D sprite, hint: "2D game sprite, side view, clean outline, flat background", profiles: [game]}
    - {id: texture, label: Tileable texture, hint: "seamless tileable texture, flat even lighting, top-down orthographic, no perspective, no objects", profiles: [game]}
    - {id: cozy, label: Cozy / cute, hint: "cute cozy game style, soft rounded shapes, warm pastel colours", profiles: [game]}
    - {id: dark, label: Dark fantasy, hint: "dark fantasy mood, desaturated, dramatic rim light", profiles: [game, film]}
    - {id: thumbnail, label: Thumbnail, hint: "video thumbnail, bold readable composition, strong focal subject, high contrast, clear space for a title, 16:9", profiles: [video, social, podcast]}
    - {id: broll, label: B-roll still, hint: "cinematic b-roll still frame, natural light, shallow depth of field, real location, no text, nobody looking at the camera", profiles: [video, film, social]}
    - {id: product, label: Product shot, hint: "clean commercial product shot, studio lighting, soft shadow, seamless backdrop, sharp focus, true-to-life materials", profiles: [video, social]}
    - {id: social_vertical, label: Social vertical, hint: "vertical 9:16 composition, subject centred in the safe area, room at the top and bottom for captions, bold and eye-catching, scroll-stopping", profiles: [social], default_for: [social]}
    - {id: cover_art, label: Podcast cover, hint: "square podcast cover art, bold simple composition, readable at thumbnail size, one strong focal element, limited palette, room for the title", profiles: [podcast], default_for: [podcast]}
    - {id: storyboard, label: Storyboard frame, hint: "storyboard frame, clear staging and camera angle, readable composition, loose monochrome pencil and ink, no text", profiles: [film, video]}
    - {id: concept_art, label: Concept art, hint: "professional concept art, painterly, atmospheric depth, strong silhouette and readable value structure", profiles: [film, game, video]}
    - {id: cinematic, label: Cinematic, hint: "cinematic lighting, anamorphic look, subtle film grain, graded colours, wide frame", profiles: [film, video]}
    - {id: photoreal, label: Photographic, hint: "photorealistic photograph, natural light, 35mm lens, fine detail, true colours", profiles: [video, social, podcast, film]}

styles:
  qwen_rgba:
    label: Qwen-Image RGBA (transparent asset)
    modality: image
    negative: true
    chips: *chips
    apply: {prompt: prompt, negative: negative}
    system: |
      TARGET: Qwen-Image-2.1 generating a TRANSPARENT asset (true RGBA output: game sprite, sticker, overlay, product cut-out).
      "prompt": START with the exact sentence "This is an RGBA image with transparency." then 40-100
      words of flowing English prose: ONE isolated subject, fully visible and not cropped, its materials,
      colours, view (three-quarter front unless the idea says otherwise), soft even lighting, art style,
      and end with "isolated on a transparent background". No scenery, no ground, no cast shadow, no text
      unless the idea asks for text (then put it in double quotes).
      "negative": short comma list of things to avoid (only used when CFG > 1).
      Variations: different material, colour or style treatments of the same isolated subject; every
      variation also starts with "This is an RGBA image with transparency.".
  qwen_image: {chips: *chips}
  qwen_edit: {chips: *chips}
  kontext: {chips: *chips}
  zimage: {chips: *chips}
  hunyuan_image: {chips: *chips}
  lumina: {chips: *chips}
  flux: {chips: *chips}
  image3d: {chips: *chips}
