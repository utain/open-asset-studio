# Open Asset Studio model registry. Schema: docs/CONTRACTS.md section 1.
# Drop-in files in models.d/*.yaml are merged after this one (same id = override), so studios can add models
# without editing this file. Numbers come from docs/research/{image,audio}_models.md and prompt_llm.md
# (measured on this DGX Spark). memory_gb = free memory (MemAvailable) the job needs before it starts.

tasks:
  t2i:          {label: Text to image,        modality: image, studio: image}
  edit:         {label: Edit image,           modality: image, studio: image}
  multi_ref:    {label: Multi-reference,      modality: image, studio: image}
  inpaint:      {label: Inpaint,              modality: image, studio: image}
  rgba:         {label: Transparent (RGBA),   modality: image, studio: image}
  extract:      {label: Extract subject,      modality: image, studio: image}
  rmbg:         {label: Remove background,    modality: image, studio: image}
  upscale:      {label: Upscale,              modality: image, studio: image}
  shape:        {label: Image to 3D shape,    modality: mesh,  studio: 3d}
  texture:      {label: Texture / retexture,  modality: mesh,  studio: 3d}
  sfx:          {label: Sound effect,         modality: audio, studio: sound}
  ambience:     {label: Ambience & loops,     modality: audio, studio: sound}
  music:        {label: Music (instrumental), modality: audio, studio: sound}
  song:         {label: Song with vocals,     modality: audio, studio: sound}
  tts:          {label: Text to speech,       modality: audio, studio: sound}
  voice_design: {label: Voice design,         modality: audio, studio: sound}
  voice_clone:  {label: Voice clone,          modality: audio, studio: sound}
  qa_clap:      {label: Prompt match (CLAP),  modality: audio, studio: sound}
  qa_asr:       {label: Transcript (Whisper), modality: audio, studio: sound}
  improve:      {label: Prompt improver,      modality: text,  studio: system}
  test:         {label: Self-test,            modality: other, studio: system}

# backend name -> venv + worker script (workers/<name>_worker.py by convention). device: gpu | cpu
backends:
  echo:
    label: core (self-test)
    python: envs/core/bin/python
    script: workers/echo_worker.py
    device: cpu
    lock: core
  qwen:
    label: envs/qwen (diffusers 0.42, torch 2.9 cu130)
    python: envs/qwen/bin/python
    script: workers/qwen_worker.py
    device: gpu
    lock: qwen
    fix: "Rebuild from env-lock/qwen.txt (see docs/SETUP.md)"
  imgtools:
    label: envs/hy3d (Real-ESRGAN, rembg)
    python: envs/hy3d/bin/python
    script: workers/imgtools_worker.py
    device: gpu
    lock: hy3d
  hy3d:
    label: envs/hy3d (Hunyuan3D-2.1)
    python: envs/hy3d/bin/python
    script: workers/hy3d_worker.py
    device: gpu
    lock: hy3d
    model_idle_s: 900
  comfyui:
    label: ComfyUI container (remote, optional)
    python: envs/core/bin/python
    script: workers/comfyui_worker.py
    device: gpu
    env: {COMFYUI_URL: "http://127.0.0.1:8188"}
  audio:
    label: envs/audio (SA3, MiniMax, MOSS-SFX, OmniVoice, F5, Orpheus, CLAP, Whisper)
    python: envs/audio/bin/python
    script: workers/audio_worker.py
    device: gpu
    lock: audio
    max_loaded: 2
  qwentts:
    label: envs/qwentts (qwen-tts 0.1.1, transformers 4.57.3)
    python: envs/qwentts/bin/python
    script: workers/qwentts_worker.py
    device: gpu
    lock: qwentts
  moss:
    label: envs/moss (MOSS-TTS, transformers 5.0.0)
    python: envs/moss/bin/python
    script: workers/moss_worker.py
    device: gpu
    lock: moss
  vllm_omni:
    label: envs/vllm_omni (vLLM-Omni) + envs/vllm_omni_overlay
    python: envs/vllm_omni/bin/python
    script: workers/vllm_omni_worker.py
    device: gpu
    lock: vllm_omni_overlay
    env: {PYTHONPATH: "{studio}/envs/vllm_omni_overlay"}
    model_idle_s: 1200
  llm:
    label: llama.cpp llama-server (prompt improver)
    kind: service
    binary: $LLAMA_SERVER
    device: gpu

models:
  # =================================================================== IMAGE
  - id: qwen-image-2.1
    name: Qwen-Image 2.1
    modality: image
    tasks: [t2i, edit, multi_ref, rgba, extract]
    default_for: [t2i, edit, rgba, extract]
    order: 10
    tags: [quality, text, rgba, bilingual]
    summary: "Best prompt adherence and text rendering (EN + ZH); real RGBA output; instruction edits with up to 10 references."
    features: {rgba: true, max_refs: 10, mask: annotate, text_render: true, negative: cfg, languages: [en, zh], tileable: false}
    backend: qwen
    weights: [{hf: Qwen/Qwen-Image-2.1, files: ["transformer/*.safetensors", "text_encoder/*.safetensors"]}]
    license: {name: "Apache-2.0 (verify on the 2.1 model card)", commercial: true, verify: true}
    memory_gb: 56
    speed: "1.9 s/step @1024 (idle GPU), ~41 s per image at 20 steps; edit adds ~30 s"
    est: {load_s: 30, run_s: 50}
    prompt_style: {t2i: qwen_image, rgba: qwen_image, edit: qwen_edit, multi_ref: qwen_edit, extract: qwen_edit}
    params:
      - {name: aspect, type: choice, choices: ["1:1", "4:3", "3:4", "3:2", "2:3", "16:9", "9:16"], default: "1:1", group: basic, tasks: [t2i, rgba]}
      - {name: size, label: Long side, type: choice, choices: [768, 1024, 1328, 1536, 2048], default: 1024, unit: px, group: basic}
      - {name: steps, type: int, min: 4, max: 60, default: 25, group: basic, help: "25 is a good default; 12 is usable for previews (slightly over-sharpened)."}
      - {name: batch, label: Images, type: int, min: 1, max: 4, default: 1, group: basic}
      - {name: transparent, label: Transparent (RGBA), type: bool, default: false, group: basic, help: "Prepends the RGBA trigger sentence: true alpha straight from the VAE."}
      - {name: seed, type: seed, default: -1}
      - {name: true_cfg, label: True CFG, type: float, min: 1, max: 10, step: 0.5, default: 1.0, group: advanced, help: "1 = no CFG (as trained). >1 enables the negative prompt and doubles the cost."}
      - {name: output_resolution, label: Reference encoding, type: choice, choices: [512, 1024, 2048], default: 1024, group: advanced, tasks: [edit, multi_ref, extract]}
      - {name: kv_cache, label: KV cache, type: bool, default: true, group: advanced}
    presets:
      fast: {steps: 12, size: 768}
      balanced: {steps: 25, size: 1024}
      quality: {steps: 40, size: 1536}

  - id: z-image-turbo
    name: Z-Image Turbo
    modality: image
    tasks: [t2i]
    order: 20
    tags: [fastest, text, commercial]
    summary: "Fastest draft model (about 18 s per 1024 image); clean product-render look, very good text. No negative prompt."
    features: {rgba: false, text_render: true, negative: false, languages: [en, zh], low_seed_diversity: true}
    backend: qwen
    weights:
      - {hf: unsloth/Z-Image-Turbo, files: ["text_encoder/*.safetensors", "vae/*.safetensors"]}
      - {hf: unsloth/Z-Image-Turbo-FP8, files: [Z-Image-Turbo-INT8.safetensors]}
    license: {name: Apache-2.0, commercial: true}
    memory_gb: 30
    speed: "1.9 s/step, 9 steps: ~19 s per 1024 image"
    est: {load_s: 12, run_s: 19}
    prompt_style: zimage
    params:
      - {name: aspect, type: choice, choices: ["1:1", "4:3", "3:4", "3:2", "2:3", "16:9", "9:16"], default: "1:1", group: basic}
      - {name: size, label: Long side, type: choice, choices: [512, 768, 1024, 1280, 1536, 2048], default: 1024, unit: px, group: basic}
      - {name: steps, type: int, min: 6, max: 12, default: 9, group: basic, help: "9 steps = 8 function evaluations (distilled)."}
      - {name: batch, label: Images, type: int, min: 1, max: 4, default: 4, group: basic}
      - {name: seed, type: seed, default: -1}
    presets:
      fast: {steps: 7, size: 768}
      balanced: {steps: 9, size: 1024}
      quality: {steps: 12, size: 1536}

  - id: flux1-kontext-dev
    name: FLUX.1 Kontext [dev]
    modality: image
    tasks: [edit, t2i]
    order: 30
    tags: [edit, non-commercial]
    summary: "Instruction edit of one image; keeps layout and text, tends to smooth materials. Non-commercial licence."
    features: {rgba: false, max_refs: 1, text_render: true, negative: false, languages: [en]}
    backend: qwen
    weights: [{hf: unsloth/FLUX.1-Kontext-dev, files: ["transformer/*.safetensors"]}]
    license: {name: "FLUX.1 [dev] Non-Commercial", commercial: false}
    memory_gb: 55
    speed: "edit 7.8 s/step (~156 s at 20 steps); t2i 2.3 s/step"
    est: {load_s: 36, run_s: 156}
    prompt_style: {edit: kontext, t2i: flux}
    params:
      - {name: aspect, type: choice, choices: ["1:1", "4:3", "3:4", "16:9", "9:16"], default: "1:1", group: basic, tasks: [t2i]}
      - {name: size, label: Long side, type: choice, choices: [768, 1024], default: 1024, unit: px, group: basic}
      - {name: steps, type: int, min: 12, max: 40, default: 28, group: basic}
      - {name: guidance, type: float, min: 1.5, max: 4.0, step: 0.1, default: 2.5, group: basic, help: "Distilled guidance: 2.5 for edits, 3.5 for text-to-image."}
      - {name: batch, label: Images, type: int, min: 1, max: 4, default: 1, group: basic}
      - {name: seed, type: seed, default: -1}
    presets:
      fast: {steps: 16}
      balanced: {steps: 24}
      quality: {steps: 28}

  - id: hunyuanimage-2.1
    name: HunyuanImage 2.1
    modality: image
    tasks: [t2i]
    order: 40
    tags: [2k, detail, stylized]
    summary: "Richest detail at native 2K (stylised game-art look); real CFG with negative prompt. Heaviest model (61 GB)."
    features: {rgba: false, text_render: true, negative: true, native_size: 2048, languages: [en, zh]}
    backend: qwen
    weights:
      - {hf: hunyuanvideo-community/HunyuanImage-2.1-Diffusers, files: ["text_encoder/*.safetensors", "vae/*"]}
      - {hf: unsloth/HunyuanImage-2.1-FP8, files: [HunyuanImage-2.1-INT8.pt]}
    license: {name: Tencent Hunyuan Community, commercial: true, note: "Not licensed in the EU, UK and South Korea; >100 M MAU needs a licence."}
    memory_gb: 65
    speed: "2K: 8.3 s/step (~170 s at 20 steps); cold load ~4 min"
    est: {load_s: 235, run_s: 170}
    prompt_style: hunyuan_image
    params:
      - {name: aspect, type: choice, choices: ["1:1", "16:9", "9:16", "4:3", "3:4"], default: "1:1", group: basic, help: "2K sizes: 2048², 2560x1536, 1536x2560, 2304x1792."}
      - {name: size, label: Long side, type: choice, choices: [1024, 2048, 2560], default: 2048, unit: px, group: basic}
      - {name: steps, type: int, min: 10, max: 50, default: 30, group: basic}
      - {name: guidance, type: float, min: 1, max: 8, step: 0.5, default: 3.5, group: advanced}
      - {name: batch, label: Images, type: int, min: 1, max: 2, default: 1, group: basic}
      - {name: seed, type: seed, default: -1}
    presets:
      fast: {steps: 20, size: 1024}
      balanced: {steps: 30, size: 2048}
      quality: {steps: 50, size: 2048}

  - id: lumina-image-2.0
    name: Lumina-Image 2.0
    modality: image
    tasks: [t2i]
    order: 50
    tags: [stylized, light]
    summary: "Light painterly / cel-shaded alternative for 2D art. Weak at text and prompt adherence."
    features: {rgba: false, text_render: false, negative: true, languages: [en]}
    backend: qwen
    weights:
      - {hf: unsloth/Lumina-Image-2.0, files: ["text_encoder/*.safetensors", "vae/*"]}
      - {hf: unsloth/Lumina-Image-2.0-FP8, files: [Lumina-Image-2.0-INT8.pt]}
    license: {name: Apache-2.0, commercial: true}
    memory_gb: 25
    speed: "1.6 s/step, ~50 s at 30 steps"
    est: {load_s: 21, run_s: 50}
    prompt_style: lumina
    params:
      - {name: aspect, type: choice, choices: ["1:1", "4:3", "3:4", "16:9", "9:16"], default: "1:1", group: basic}
      - {name: size, label: Long side, type: choice, choices: [768, 1024], default: 1024, unit: px, group: basic}
      - {name: steps, type: int, min: 20, max: 60, default: 30, group: basic}
      - {name: guidance, type: float, min: 1, max: 8, step: 0.5, default: 4.0, group: advanced}
      - {name: cfg_trunc_ratio, label: CFG truncation, type: float, min: 0.1, max: 1.0, step: 0.05, default: 0.25, group: advanced}
      - {name: batch, label: Images, type: int, min: 1, max: 4, default: 1, group: basic}
      - {name: seed, type: seed, default: -1}
    presets: {fast: {steps: 20}, balanced: {steps: 30}, quality: {steps: 50}}

  - id: flux1-krea-dev
    name: FLUX.1 Krea [dev]
    modality: image
    tasks: [t2i]
    order: 60
    tags: [non-commercial]
    summary: "Aesthetic FLUX fine-tune. Transformer weights are not downloaded."
    features: {rgba: false, text_render: true, negative: false}
    backend: qwen
    weights: [{hf: unsloth/FLUX.1-Krea-dev, files: ["transformer/*.safetensors"]}]
    license: {name: "FLUX.1 [dev] Non-Commercial", commercial: false}
    memory_gb: 50
    speed: "~ like Kontext t2i (2.3 s/step)"
    prompt_style: flux
    params:
      - {name: aspect, type: choice, choices: ["1:1", "4:3", "3:4", "16:9", "9:16"], default: "1:1", group: basic}
      - {name: size, label: Long side, type: choice, choices: [768, 1024, 1536], default: 1024, unit: px, group: basic}
      - {name: steps, type: int, min: 12, max: 50, default: 28, group: basic}
      - {name: guidance, type: float, min: 1.5, max: 6, step: 0.1, default: 4.0, group: basic}
      - {name: seed, type: seed, default: -1}
    presets: {fast: {steps: 16}, balanced: {steps: 28}, quality: {steps: 40}}

  - id: flux2-klein-comfy
    name: FLUX.2 klein-base 9B (ComfyUI)
    modality: image
    tasks: [t2i, edit, multi_ref]
    order: 70
    tags: [remote, non-commercial]
    summary: "Runs inside the ComfyUI container (fp8). Multi-reference edits through ReferenceLatent. Optional backend."
    features: {rgba: false, max_refs: 4, negative: true, remote: comfyui}
    backend: comfyui
    weights: []
    license: {name: FLUX Non-Commercial, commercial: false}
    memory_gb: 30
    speed: "20-50 steps, CFG 4-5 (base model)"
    prompt_style: {t2i: flux, edit: kontext, multi_ref: qwen_edit}
    params:
      - {name: aspect, type: choice, choices: ["1:1", "4:3", "3:4", "16:9", "9:16"], default: "1:1", group: basic}
      - {name: size, label: Long side, type: choice, choices: [768, 1024, 1536], default: 1024, unit: px, group: basic}
      - {name: steps, type: int, min: 10, max: 50, default: 28, group: basic}
      - {name: guidance, label: CFG, type: float, min: 1, max: 8, step: 0.5, default: 4.5, group: basic}
      - {name: seed, type: seed, default: -1}
    presets: {fast: {steps: 16}, balanced: {steps: 28}, quality: {steps: 40}}

  - id: realesrgan-x4
    name: Real-ESRGAN x4plus
    modality: image
    tasks: [upscale]
    default_for: [upscale]
    order: 80
    tags: [tool, alpha]
    summary: "2x / 4x upscale, keeps alpha. 4 s for 512 -> 2048."
    features: {rgba: true}
    backend: imgtools
    weights: [{path: engines/hy3d/vendor/Hunyuan3D-2.1/hy3dpaint/ckpt/RealESRGAN_x4plus.pth}]
    license: {name: BSD-3-Clause, commercial: true}
    memory_gb: 4
    speed: "4.3 s for 512 -> 2048"
    est: {load_s: 1, run_s: 5}
    params:
      - {name: scale, type: choice, choices: [2, 4], default: 4, group: basic}
      - {name: tile, label: Tile size, type: choice, choices: [0, 256, 512], default: 0, group: advanced, help: "0 = no tiling. Use 256 if memory is tight."}
    presets: {}

  - id: rembg-u2net
    name: rembg u2net
    modality: image
    tasks: [rmbg]
    default_for: [rmbg]
    order: 81
    tags: [tool, cpu]
    summary: "Background removal on the CPU (0.4 s per 1024 image)."
    features: {rgba: true}
    backend: imgtools
    device: cpu
    weights: [{path: ~/.u2net/u2net.onnx}]
    license: {name: Apache-2.0, commercial: true}
    memory_gb: 0
    speed: "0.4 s per 1024 image (CPU)"
    est: {load_s: 1, run_s: 1}
    params:
      - {name: alpha_matting, label: Alpha matting, type: bool, default: false, group: advanced}
    presets: {}

  - id: rembg-birefnet
    name: BiRefNet general (rembg)
    modality: image
    tasks: [rmbg]
    order: 82
    tags: [tool, hair]
    summary: "Better edges for hair and fur. The 973 MB onnx is not downloaded yet."
    features: {rgba: true}
    backend: imgtools
    device: cpu
    weights: [{path: ~/.u2net/birefnet-general.onnx, fix: "envs: envs/hy3d/bin/python -c \"from rembg import new_session; new_session('birefnet-general')\" (one-time download, 973 MB)"}]
    license: {name: MIT, commercial: true}
    memory_gb: 0
    speed: "a few s per image (CPU)"
    params: []
    presets: {}

  # =================================================================== 3D
  - id: hunyuan3d-2.1
    name: Hunyuan3D 2.1
    modality: mesh
    tasks: [shape, texture]
    default_for: [shape, texture]
    order: 10
    tags: [pbr, glb]
    summary: "Image -> 3D shape (DiT) and PBR texture painting; GLB export. Runs on the bundled Hunyuan3D engine (engines/hy3d)."
    features: {input: image, pbr: true, export: [glb, obj, ply, stl], max_refs: 1}
    backend: hy3d
    weights:
      - {hf: tencent/Hunyuan3D-2.1, files: ["hunyuan3d-dit-v2-1/*", "hunyuan3d-paintpbr-v2-1/*"]}
      - {hf: facebook/dinov2-giant}
    license: {name: Tencent Hunyuan Community, commercial: true, note: "Not licensed in the EU, UK and South Korea; >1 M MAU needs a licence."}
    memory_gb: 45
    speed: "shape ~1 min, texture ~3-5 min (balanced)"
    est: {load_s: 60, run_s: 240}
    params:
      - {name: steps, label: Shape steps, type: int, min: 5, max: 100, default: 30, group: basic, tasks: [shape]}
      - {name: guidance, label: Shape guidance, type: float, min: 1, max: 15, step: 0.5, default: 5.0, group: advanced, tasks: [shape]}
      - {name: octree, label: Octree resolution, type: choice, choices: [196, 256, 384, 512], default: 256, group: basic, tasks: [shape]}
      - {name: remove_bg, label: Remove background, type: bool, default: true, group: basic, tasks: [shape]}
      - {name: border_ratio, label: Border, type: float, min: 0, max: 0.3, step: 0.01, default: 0.15, group: advanced, tasks: [shape]}
      - {name: num_chunks, label: Chunks, type: int, min: 1000, max: 2000000, default: 200000, group: advanced, tasks: [shape]}
      - {name: seed, type: seed, default: -1}
      - {name: textured, label: Paint texture, type: bool, default: true, group: basic, tasks: [shape]}
      - {name: tex_faces, label: Texture faces, type: int, min: 2000, max: 150000, default: 40000, group: basic}
      - {name: tex_views, label: Views, type: int, min: 6, max: 9, default: 8, group: advanced}
      - {name: tex_resolution, label: View resolution, type: choice, choices: [512, 768], default: 512, group: advanced}
      - {name: tex_steps, label: Texture steps, type: int, min: 4, max: 50, default: 15, group: advanced}
      - {name: tex_size, label: Texture size, type: choice, choices: [2048, 4096, 8192], default: 4096, group: basic}
      - {name: super_res, label: Super-resolution, type: bool, default: true, group: advanced}
    presets:
      fast: {steps: 20, octree: 196, tex_faces: 20000, tex_views: 6, tex_size: 2048}
      balanced: {steps: 30, octree: 256, tex_faces: 40000, tex_views: 8, tex_size: 4096}
      quality: {steps: 50, octree: 384, tex_faces: 60000, tex_views: 9, tex_resolution: 768, tex_steps: 25}

  # =================================================================== SOUND: SFX / ambience / music
  - id: sa3-small-sfx
    name: Stable Audio 3 Small SFX
    modality: audio
    tasks: [sfx]
    default_for: [sfx]
    order: 10
    tags: [fast, sfx]
    summary: "One-shot SFX and UI sounds; sub-second warm generation, 2 GB. English prompts."
    features: {max_seconds: 120, sample_rate: 44100, channels: 2, negative: true, languages: [en]}
    backend: audio
    weights: [{hf: stabilityai/stable-audio-3-small-sfx, files: [model.safetensors]}]
    license: {name: Stability AI Community, commercial: true, note: "Free under USD 1 M revenue; register and show 'Powered by Stability AI'."}
    memory_gb: 4
    speed: "warm ~1-2 s per clip (cold 4 s load)"
    est: {load_s: 5, run_s: 3}
    prompt_style: sfx
    params:
      - {name: seconds, label: Duration, type: float, min: 0.5, max: 120, step: 0.5, default: 3, unit: s, group: basic}
      - {name: batch, label: Takes, type: int, min: 1, max: 8, default: 4, group: basic}
      - {name: seed, type: seed, default: -1}
      - {name: steps, type: int, min: 4, max: 50, default: 8, group: advanced, help: "ARC-distilled: 8 steps is the trained setting."}
      - {name: cfg_scale, label: CFG, type: float, min: 1, max: 7, step: 0.5, default: 1.0, group: advanced}
    presets: {fast: {batch: 2}, balanced: {batch: 4}, quality: {batch: 8}}

  - id: sa3-medium
    name: Stable Audio 3 Medium
    modality: audio
    tasks: [sfx, ambience, music]
    default_for: [ambience, music]
    order: 20
    tags: [music, ambience, stereo]
    summary: "Instrumental music, ambience beds up to ~6 min and richer SFX; 44.1 kHz stereo. Add BPM and key for music."
    features: {max_seconds: 380, sample_rate: 44100, channels: 2, negative: true, inpaint: true, languages: [en]}
    backend: audio
    weights: [{hf: stabilityai/stable-audio-3-medium}]
    license: {name: Stability AI Community, commercial: true, note: "Free under USD 1 M revenue; register and show 'Powered by Stability AI'."}
    memory_gb: 10
    speed: "30 s of music in ~15 s cold, faster warm"
    est: {load_s: 17, run_s: 15}
    prompt_style: {sfx: sfx, ambience: ambience, music: sa3_music}
    params:
      - {name: seconds, label: Duration, type: float, min: 1, max: 380, step: 1, default: 30, unit: s, group: basic}
      - {name: batch, label: Takes, type: int, min: 1, max: 4, default: 2, group: basic}
      - {name: seed, type: seed, default: -1}
      - {name: steps, type: int, min: 4, max: 50, default: 8, group: advanced}
